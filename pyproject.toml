[project]
name = "defence-agent"
version = "0.1.0"
description = "ADK-first Cohere RAG agent demo for a fictional public-sector doctrine assistant."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "cohere>=5.13.0",
    "google-adk[extensions]>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "reportlab>=4.2.0",
    "tenacity>=8.5.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["defence_agent*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "streamlit[pdf]>=1.50.0",
]
adk = [
    "google-adk[extensions]>=1.0.0",
]
ui = [
    "streamlit[pdf]>=1.50.0",
]
compass = [
    "cohere-compass-sdk>=2.11.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["defence_agent/tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that call live Cohere services or require live Chroma index state",
    "streamlit: tests that exercise Streamlit AppTest or UI rendering",
    "slow_offline: local tests that are slower but do not call external services",
]
