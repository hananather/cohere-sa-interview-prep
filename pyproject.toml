[project]
name = "defence-agent"
version = "0.1.0"
description = "Production-shaped Streamlit and FastAPI agentic RAG prototype for a fictional public-sector customer."
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "sqlmodel>=0.0.22",
    "streamlit>=1.38.0",
    "tenacity>=8.5.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["defence_agent/backend"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["defence_agent/backend"]
testpaths = ["defence_agent/tests"]
addopts = "-q"
