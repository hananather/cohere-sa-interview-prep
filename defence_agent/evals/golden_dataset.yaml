cases:
  - id: direct_cross_unit_review
    slice: direct_answerable
    user: planning_analyst
    query: "What review steps should planning staff complete before approving a cross-unit planning request?"
    expected_route: direct_rag
    expected_tools: [search_doctrine, validate_citations]
    expected_docs: ["Operational Planning SOP 2025", "Planning Staff Handbook 2025"]
    expect_citations: true
    expect_abstain: false

