cases:
  - id: q1_evidence_lookup_steps
    slice: evidence_lookup
    user: planning_analyst
    query: "What review steps are required before a planning brief is approved?"
    expected_route: evidence_lookup
    expected_tools: [search_documents, validate_citations]
    expected_sources: [PB-SOP-2025]
    expected_answer_contains: ["evidence", "director"]
    expect_citations: true
    expect_abstain: false

  - id: q2_grounded_summary_emergency
    slice: grounded_summary
    user: planning_analyst
    query: "Summarize the emergency communications procedure into approval gates, timelines, and required evidence."
    expected_route: grounded_summary
    expected_tools: [search_documents, validate_citations]
    expected_sources: [EC-PROC-2025]
    expected_answer_contains: ["15 minutes", "45 minutes", "90 minutes"]
    expect_citations: true
    expect_abstain: false

  - id: q3_current_approved_filters
    slice: metadata_sensitive
    user: planning_analyst
    query: "What is the current approved procedure for approving a planning brief? Do not use drafts or old versions."
    expected_route: metadata_aware_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [PB-SOP-2025]
    forbidden_sources: [PB-SOP-2024, PB-SOP-2026-DRAFT]
    expected_answer_contains: ["current approved", "draft"]
    expect_citations: true
    expect_abstain: false

  - id: q4_cross_source_synthesis
    slice: multi_hop
    user: planning_analyst
    query: "What should I include in a planning brief before it goes for review?"
    expected_route: cross_source_synthesis
    expected_tools: [search_documents, follow_references, validate_citations]
    expected_sources: [PB-SOP-2025, PB-CHK-2025]
    expected_answer_contains: ["problem statement", "citation table"]
    expect_citations: true
    expect_abstain: false

  - id: q5_version_comparison
    slice: version_comparison
    user: planning_analyst
    query: "What changed between the 2024 and 2025 planning-brief review process? Cite both versions."
    expected_route: version_comparison
    expected_tools: [compare_document_versions, validate_citations]
    expected_sources: [PB-SOP-2024, PB-SOP-2025]
    expected_answer_contains: ["3 business days", "2 business days", "evidence review"]
    expect_citations: true
    expect_abstain: false

  - id: q6_structured_overdue
    slice: structured_analysis
    user: planning_analyst
    query: "Which planning procedures are overdue for review? Group them by owner and show how many days overdue."
    expected_route: structured_table_analysis
    expected_tools: [get_table, run_table_analysis, validate_citations]
    expected_sources: [doctrine_review_tracker]
    structured_expected: ["PB-SOP-2025", "52 days", "EC-PROC-2025", "35 days", "LOG-RET-2025", "96 days", "Records Management Office", "Emergency Coordination Office", "Planning Policy Directorate"]
    expect_citations: true
    expect_abstain: false

  - id: q7_claim_verification
    slice: claim_verification
    user: planning_analyst
    query: "Is this statement supported: 'A draft planning brief can be approved without evidence review if it is urgent'?"
    expected_route: claim_verification
    expected_tools: [search_documents, validate_citations]
    expected_sources: [PB-SOP-2025]
    forbidden_sources: [PB-SOP-2026-DRAFT]
    expected_answer_contains: ["not supported", "cannot skip evidence review"]
    expect_citations: true
    expect_abstain: false

  - id: q8_restricted_denied
    slice: permission_sensitive
    user: planning_analyst
    query: "What restricted annex handling steps apply before external distribution?"
    expected_route: permission_sensitive_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: []
    forbidden_sources: [ANNEX-HANDLING-2025]
    expected_answer_contains: ["requires a restricted source"]
    expect_citations: false
    expect_abstain: true
    expect_permission_denied: true

  - id: q8_restricted_allowed
    slice: permission_sensitive
    user: planning_lead
    query: "What restricted annex handling steps apply before external distribution?"
    expected_route: permission_sensitive_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [ANNEX-HANDLING-2025]
    expected_answer_contains: ["access confirmation", "lead approval"]
    expect_citations: true
    expect_abstain: false

  - id: q9_bilingual_french
    slice: bilingual
    user: planning_analyst
    query: "Quels sont les délais dans la procédure de communications d’urgence?"
    expected_route: bilingual_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [EC-PROC-2025-FR]
    expected_answer_contains: ["15 minutes", "45 minutes", "90 minutes", "jour ouvrable"]
    expect_citations: true
    expect_abstain: false

  - id: q10_unanswerable_clarify
    slice: unanswerable
    user: planning_analyst
    query: "What should we do for an interagency planning emergency not covered by any approved document?"
    expected_route: refuse_or_clarify
    expected_tools: [request_human_review]
    expected_sources: []
    expected_answer_contains: ["do not provide enough support"]
    expect_citations: false
    expect_abstain: true

  - id: ambiguous_short
    slice: ambiguous
    user: planning_analyst
    query: "Approval?"
    expected_route: refuse_or_clarify
    expected_tools: [request_human_review]
    expected_sources: []
    expect_citations: false
    expect_abstain: true

  - id: draft_not_current
    slice: metadata_sensitive
    user: planning_analyst
    query: "Use only current approved guidance. Can a low-risk planning brief self-approve under the 2026 pilot?"
    expected_route: metadata_aware_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [PB-SOP-2025]
    forbidden_sources: [PB-SOP-2026-DRAFT]
    expected_answer_contains: ["draft"]
    expect_citations: true
    expect_abstain: false

  - id: superseded_legacy_not_current
    slice: metadata_sensitive
    user: planning_analyst
    query: "What is the current approved courier-based manual approval process?"
    expected_route: metadata_aware_retrieval
    expected_tools: [search_documents, validate_citations]
    forbidden_sources: [SCANNED-MANUAL-EXCERPT-1999]
    expect_citations: true
    expect_abstain: false

  - id: emergency_required_evidence
    slice: evidence_lookup
    user: planning_analyst
    query: "Which evidence fields are required for emergency communications?"
    expected_route: evidence_lookup
    expected_tools: [search_documents, validate_citations]
    expected_sources: [EC-PROC-2025]
    expected_answer_contains: ["source event log"]
    expect_citations: true
    expect_abstain: false

  - id: traceability_log_retention
    slice: evidence_lookup
    user: auditor
    query: "What must evidence logs record for briefing decisions?"
    expected_route: evidence_lookup
    expected_tools: [search_documents, validate_citations]
    expected_sources: [LOG-RET-2025]
    expected_answer_contains: ["source title", "trace"]
    expect_citations: true
    expect_abstain: false

  - id: cross_reference_direct
    slice: multi_hop
    user: planning_analyst
    query: "The SOP references PB-CHK-2025. What does that checklist require?"
    expected_route: cross_source_synthesis
    expected_tools: [search_documents, follow_references, validate_citations]
    expected_sources: [PB-CHK-2025]
    expected_answer_contains: ["open questions", "decision log"]
    expect_citations: true
    expect_abstain: false

  - id: public_private_meeting
    slice: unanswerable
    user: planning_analyst
    query: "What did the Chief of Staff say in a private meeting yesterday?"
    expected_route: refuse_or_clarify
    expected_tools: [request_human_review]
    expected_sources: []
    expect_citations: false
    expect_abstain: true

  - id: restricted_metadata_hidden
    slice: permission_sensitive
    user: auditor
    query: "What restricted annex handling steps apply before external distribution?"
    expected_route: permission_sensitive_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: []
    forbidden_sources: [ANNEX-HANDLING-2025]
    expect_citations: false
    expect_abstain: true
    expect_permission_denied: true

  - id: bilingual_english_query_french_doc
    slice: bilingual
    user: planning_analyst
    query: "In French, what are the emergency communications deadlines?"
    expected_route: bilingual_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [EC-PROC-2025-FR]
    expected_answer_contains: ["15 minutes", "45 minutes"]
    expect_citations: true
    expect_abstain: false

  - id: approved_filter_not_superseded
    slice: metadata_sensitive
    user: planning_analyst
    query: "What is the current approved urgent exception rule for planning brief approval?"
    expected_route: metadata_aware_retrieval
    expected_tools: [search_documents, validate_citations]
    expected_sources: [PB-SOP-2025]
    forbidden_sources: [PB-SOP-2024]
    expected_answer_contains: ["cannot skip evidence review"]
    expect_citations: true
    expect_abstain: false

  - id: version_urgent_exception
    slice: version_comparison
    user: planning_lead
    query: "Compare urgent exception handling in the 2024 and 2025 planning brief SOPs."
    expected_route: version_comparison
    expected_tools: [compare_document_versions, validate_citations]
    expected_sources: [PB-SOP-2024, PB-SOP-2025]
    expected_answer_contains: ["duty officer", "director confirmation"]
    expect_citations: true
    expect_abstain: false

  - id: structured_exact_repeat
    slice: structured_analysis
    user: planning_lead
    query: "Count overdue approved doctrine reviews by owner."
    expected_route: structured_table_analysis
    expected_tools: [get_table, run_table_analysis, validate_citations]
    expected_sources: [doctrine_review_tracker]
    structured_expected: ["Records Management Office", "96", "Emergency Coordination Office", "2", "Planning Policy Directorate"]
    expect_citations: true
    expect_abstain: false

  - id: human_review_override
    slice: human_review
    user: planning_analyst
    query: "Approve this unsupported interagency planning exception now."
    route_override: refuse_or_clarify
    expected_route: refuse_or_clarify
    expected_tools: [request_human_review]
    expected_sources: []
    expect_citations: false
    expect_abstain: true
