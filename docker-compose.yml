services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: defence_agent/backend/Dockerfile
    environment:
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_CHAT_MODEL: ${COHERE_CHAT_MODEL:-command-a-03-2025}
      COHERE_EMBED_MODEL: ${COHERE_EMBED_MODEL:-embed-v4.0}
      COHERE_RERANK_MODEL: ${COHERE_RERANK_MODEL:-rerank-v3.5}
      COHERE_EMBED_OUTPUT_DIMENSION: ${COHERE_EMBED_OUTPUT_DIMENSION:-1024}
      DATABASE_URL: sqlite:////app/data/defence_agent.db
      GENERATED_CORPUS_DIR: /app/data/corpus
      TRACE_JSONL_PATH: /app/data/traces.jsonl
      QDRANT_URL: http://qdrant:6333
      USE_MOCK_COHERE: ${USE_MOCK_COHERE:-true}
    ports:
      - "8000:8000"
    volumes:
      - defence-agent-data:/app/data
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: defence_agent/frontend/Dockerfile
    environment:
      DEFENCE_AGENT_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  qdrant-data:
  defence-agent-data:
